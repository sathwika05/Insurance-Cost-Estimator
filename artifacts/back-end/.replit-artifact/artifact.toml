kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/back-end run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/back-end", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/back-end/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 8001
name = "ML Server"
paths = ["/api/predict"]

[services.development]
run = "bash /home/runner/workspace/artifacts/ml-server/start.sh"

[services.production]

[services.production.build]
args = ["bash", "artifacts/ml-server/setup.sh"]

[services.production.run]
args = ["bash", "artifacts/ml-server/start.sh"]

[services.production.run.env]
PORT = "8001"
